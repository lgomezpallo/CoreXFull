name: Deploy IAchat image previews
on:
  push:
    branches: [prisma/code-agent-json-diagnostics-20261014]
    paths: [.github/workflows/oracle-iachat-deploy.yml]
permissions:
  contents: read
  statuses: write
concurrency:
  group: oracle-iachat-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Deploy IAchat web UI with rollback
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/Proyecto/Aplicaciones/IAchat
          target=iachat/web.py
          backup=$(mktemp /tmp/iachat-web.XXXXXXXX.py)
          candidate=$(mktemp /tmp/iachat-new.XXXXXXXX.py)
          cp "$target" "$backup"
          changed=0
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$changed" -eq 1 ]; then
              cp "$backup" "$target"
              sudo -n systemctl restart iachat.service || true
              echo "IACHAT_ROLLED_BACK"
            fi
            rm -f "$backup" "$candidate"
          }
          trap cleanup EXIT
          GIT_SSH_COMMAND='ssh -i /home/ubuntu/.ssh/github_iachat -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' git fetch --no-tags git@github.com:lgomezpallo/I.achat.Full.git main
          git show FETCH_HEAD:iachat/web.py > "$candidate"
          python3 - "$candidate" <<'PY'
          import sys
          from pathlib import Path
          s=Path(sys.argv[1]).read_text()
          assert 'var selectedFiles=[]' in s
          assert "IAchat upload failure" in s
          assert "IAchat display failure after successful send" in s
          assert "remove.setAttribute('aria-label','Quitar '+f.name)" in s
          assert "selectedFiles=[];fileInput.value='';imageInput.value='';showSelectedAttachments()" in s
          assert "className=\'sent-image\'" in s
          assert "payload.attachments.forEach" in s
          compile(s, sys.argv[1], 'exec')
          print("IAchat source validated")
          PY
          cp "$candidate" "$target"
          changed=1
          sudo -n systemctl restart iachat.service
          sleep 3
          systemctl is-active --quiet iachat.service
          curl -fsS --max-time 10 http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl -fsS --max-time 10 http://127.0.0.1:8000/ | grep -q 'var selectedFiles=\[\]'
          curl -fsS --max-time 10 http://127.0.0.1:8000/ | grep -q 'IAchat upload failure'
          curl -fsS --max-time 10 http://127.0.0.1:8000/ | grep -q 'IAchat display failure after successful send'
          curl -fsS --max-time 10 http://127.0.0.1:8000/ | grep -q "className=\'sent-image\'"
          echo "IACHAT_IMAGE_PREVIEWS_DEPLOY_VERIFIED"
      - name: Publish deployment result to GitHub commit status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            state=success
            description="IAchat deploy and live health checks passed"
          else
            state=failure
            description="IAchat deploy failed or was rolled back"
          fi
          python3 - "$state" "$description" <<'PY'
          import json, os, sys, urllib.request
          state, description = sys.argv[1:]
          url = "https://api.github.com/repos/" + os.environ["REPOSITORY"] + "/statuses/" + os.environ["COMMIT_SHA"]
          payload = json.dumps({"state": state, "context": "oracle/iachat-deploy", "description": description, "target_url": os.environ["RUN_URL"]}).encode()
          req = urllib.request.Request(url, data=payload, method="POST", headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          })
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status != 201:
                  raise RuntimeError("GitHub commit status API returned " + str(response.status))
          print("IACHAT_DEPLOY_STATUS_PUBLISHED", state)
          PY

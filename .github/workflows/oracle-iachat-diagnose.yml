name: Test IAchat Router vision end-to-end
on:
  push:
    branches: [prisma/code-agent-json-diagnostics-20261014]
    paths: [.github/workflows/oracle-iachat-diagnose.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Read-only IAchat and proxy diagnosis
        shell: bash
        run: |
          set -euo pipefail
          echo "=== SERVICES ==="
          systemctl is-active iachat.service router.service
          echo "=== REAL VISION TEST VIA IAchat BACKEND ==="
          cd /home/ubuntu/Proyecto/Aplicaciones/IAchat
          python3 - <<'PY'
          import base64, importlib, os, struct, sys, zlib
          from pathlib import Path
          from time import monotonic
          def png():
              def chunk(tag, data):
                  return struct.pack(">I",len(data))+tag+data+struct.pack(">I",zlib.crc32(tag+data)&0xffffffff)
              w=h=12
              raw=b"".join(b"\\x00"+b"\\xff\\x00\\x00"*w for _ in range(h))
              return bytes([137,80,78,71,13,10,26,10])+chunk(b"IHDR",struct.pack(">IIBBBBB",w,h,8,2,0,0,0))+chunk(b"IDAT",zlib.compress(raw))+chunk(b"IEND",b"")
          from iachat.attachments import extract_images
          from types import SimpleNamespace
          payload=base64.b64encode(png()).decode()
          images,names=extract_images([SimpleNamespace(name="test-red.png",content_base64=payload)])
          print("IMAGE_VALIDATION_OK",names,flush=True)
          from iachat.backend import RouterFirstBackend
          env_file=Path("/etc/iachat-router.env")
          if env_file.exists():
              for line in env_file.read_text().splitlines():
                  if line.startswith("ROUTER_TOKEN="):
                      os.environ["ROUTER_TOKEN"]=line.partition("=")[2].strip().strip('"').strip("'")
                  if line.startswith("ROUTER_URL="):
                      os.environ["ROUTER_URL"]=line.partition("=")[2].strip().strip('"').strip("'")
          os.environ.setdefault("ROUTER_URL","http://127.0.0.1:8010")
          start=monotonic()
          try:
              answer=RouterFirstBackend(timeout_s=45).answer([{"role":"user","content":"¿De qué color es el cuadrado de esta imagen? Respondé en una frase breve."}],images=images)
              print("VISION_TEST_OK", "elapsed_seconds",round(monotonic()-start,1),"answer",answer[:180],flush=True)
          except Exception as exc:
              print("VISION_TEST_FAILED","elapsed_seconds",round(monotonic()-start,1),"error_type",type(exc).__name__,"error_code",str(exc)[:120],flush=True)
              sys.exit(1)
          PY

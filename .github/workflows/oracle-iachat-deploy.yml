name: Deploy IAchat multimodal follow-up context
on:
  push:
    branches: [prisma/code-agent-json-diagnostics-20261014]
    paths: [.github/workflows/oracle-iachat-deploy.yml]
permissions:
  contents: read
  statuses: write
concurrency:
  group: oracle-iachat-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Deploy multimodal IAchat with rollback
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/Proyecto/Aplicaciones/IAchat
          backup=$(mktemp -d /tmp/iachat-multimodal.XXXXXXXX)
          changed=0
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$changed" -eq 1 ]; then
              cp "$backup/app.py" iachat/app.py
              cp "$backup/store.py" iachat/store.py
              cp "$backup/backend.py" iachat/backend.py
              sudo -n systemctl restart iachat.service || true
              echo "IACHAT_MULTIMODAL_ROLLED_BACK"
            fi
            rm -rf "$backup"
          }
          trap cleanup EXIT
          cp iachat/app.py "$backup/app.py"
          cp iachat/store.py "$backup/store.py"
          cp iachat/backend.py "$backup/backend.py"
          GIT_SSH_COMMAND='ssh -i /home/ubuntu/.ssh/github_iachat -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' git fetch --no-tags git@github.com:lgomezpallo/I.achat.Full.git main
          git show FETCH_HEAD:iachat/app.py > "$backup/new-app.py"
          git show FETCH_HEAD:iachat/store.py > "$backup/new-store.py"
          git show FETCH_HEAD:iachat/backend.py > "$backup/new-backend.py"
          python3 - "$backup/new-app.py" "$backup/new-store.py" "$backup/new-backend.py" <<'PY'
          import sys
          from pathlib import Path
          for p in sys.argv[1:]:
              compile(Path(p).read_text(), p, 'exec')
          assert 'store.images_for_conversation' in Path(sys.argv[1]).read_text()
          assert 'store.save_images' in Path(sys.argv[1]).read_text()
          assert 'CREATE TABLE IF NOT EXISTS image_attachments' in Path(sys.argv[2]).read_text()
          print("IACHAT_MULTIMODAL_SOURCE_VALIDATED")
          PY
          cp "$backup/new-app.py" iachat/app.py
          cp "$backup/new-store.py" iachat/store.py
          cp "$backup/new-backend.py" iachat/backend.py
          changed=1
          sudo -n systemctl restart iachat.service
          sleep 3
          systemctl is-active --quiet iachat.service
          curl -fsS --max-time 10 http://127.0.0.1:8000/health | grep -Fq '"status":"ok"'
          echo "IACHAT_MULTIMODAL_DEPLOY_VERIFIED"
      - name: Publish deployment result to GitHub commit status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_OUTCOME" = "success" ]; then
            state=success
            description="IAchat deploy and live health checks passed"
          else
            state=failure
            description="IAchat deploy failed or was rolled back"
          fi
          python3 - "$state" "$description" <<'PY'
          import json, os, sys, urllib.request
          state, description = sys.argv[1:]
          url = "https://api.github.com/repos/" + os.environ["REPOSITORY"] + "/statuses/" + os.environ["COMMIT_SHA"]
          payload = json.dumps({"state": state, "context": "oracle/iachat-deploy", "description": description, "target_url": os.environ["RUN_URL"]}).encode()
          req = urllib.request.Request(url, data=payload, method="POST", headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          })
          with urllib.request.urlopen(req, timeout=20) as response:
              if response.status != 201:
                  raise RuntimeError("GitHub commit status API returned " + str(response.status))
          print("IACHAT_DEPLOY_STATUS_PUBLISHED", state)
          PY

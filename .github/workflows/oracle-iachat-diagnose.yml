name: Inspect latest IAchat conversation (read-only)
on:
  push:
    branches: [prisma/code-agent-json-diagnostics-20261014]
    paths: [.github/workflows/oracle-iachat-diagnose.yml]
permissions:
  contents: read
  statuses: write
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Inspect latest admin conversation without image bytes
        id: diagnose
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, sqlite3, os
          from pathlib import Path
          candidates = [Path('/home/ubuntu/Proyecto/Datos/IAchat/iachat.db'),Path('/home/ubuntu/Proyecto/Aplicaciones/IAchat/iachat.db')]
          candidates += list(Path('/home/ubuntu/Proyecto/Datos/IAchat').glob('*.db')) if Path('/home/ubuntu/Proyecto/Datos/IAchat').exists() else []
          found=False
          for db in dict.fromkeys(candidates):
              if not db.is_file(): continue
              try:
                  con=sqlite3.connect('file:'+str(db)+'?mode=ro',uri=True)
                  tables={r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table'")}
                  if not {'conversations','conversation_index'}.issubset(tables): continue
                  row=con.execute("SELECT c.id,c.history,i.updated_at FROM conversations c JOIN conversation_index i ON c.id=i.id WHERE c.owner='admin' AND i.owner='admin' ORDER BY i.updated_at DESC LIMIT 1").fetchone()
                  if not row: continue
                  found=True
                  print('LATEST_CONVERSATION_FOUND',flush=True)
                  cid,raw,_=row
                  history=json.loads(raw)
                  print('MESSAGE_COUNT',len(history),flush=True)
                  for index,m in list(enumerate(history))[-12:]:
                      content=str(m.get('content','')).replace('\n',' ')
                      print('TURN',index,'ROLE',m.get('role'),'TEXT',repr(content[:600]),flush=True)
                  if 'image_attachments' in tables:
                      records=con.execute("SELECT message_index,filename,length(data_url) FROM image_attachments WHERE conversation_id=? AND owner='admin' ORDER BY message_index",(cid,)).fetchall()
                      print('IMAGE_METADATA',repr(records[-12:]),flush=True)
                  break
              except (sqlite3.Error,ValueError) as e:
                  print('DB_READ_ERROR',type(e).__name__,flush=True)
          if not found: raise SystemExit('NO_ADMIN_CONVERSATION_FOUND')
          PY
      - name: Publish diagnostic status
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.diagnose.outcome }}
          COMMIT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          state='success' if os.environ['OUTCOME']=='success' else 'failure'
          payload=json.dumps({'state':state,'context':'oracle/iachat-conversation-inspection','description':'Read-only recent conversation diagnosis: '+state,'target_url':os.environ['RUN_URL']}).encode()
          req=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPOSITORY']+'/statuses/'+os.environ['COMMIT_SHA'],data=payload,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=20) as resp: assert resp.status==201
          PY

openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: Assistant chat and image generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/chat:
    post:
      operationId: streamAiChat
      tags: [ai]
      summary: Stream an AI conversation response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatRequest"
      responses:
        "200":
          description: Server-sent stream of assistant text chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"
        "500":
          description: AI response could not be generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"
  /ai/generate-image:
    post:
      operationId: generateAiImage
      tags: [ai]
      summary: Generate an image from a text prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiImageRequest"
      responses:
        "200":
          description: Generated image encoded as base64
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiImageResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"
        "500":
          description: Image could not be generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AiChatRequest:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/AiChatMessage"
        mode:
          type: string
          enum: [chat, document]
      required:
        - messages
        - mode
    AiChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 12000
      required:
        - role
        - content
    AiImageRequest:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
        size:
          type: string
          enum: [1024x1024, 1536x1024, 1024x1536, auto]
      required:
        - prompt
    AiImageResponse:
      type: object
      properties:
        b64_json:
          type: string
      required:
        - b64_json
    AiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

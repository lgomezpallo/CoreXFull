openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: app-builder
    description: Natural-language app generation
  - name: generated-projects
    description: Source-project generation and validation
  - name: router
    description: User-owned Router IA providers
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /builder/converse:
    post:
      operationId: discussBuilderIdea
      tags: [app-builder]
      summary: Discuss and progressively define an app without generating it
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderConversationInput"
      responses:
        "200":
          description: Conversational reply, accumulated brief, and build availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderConversationResult"
        "400":
          description: Invalid request
        "502":
          description: Conversation temporarily unavailable
  /builder/generate:
    post:
      operationId: generateAppBlueprint
      tags: [app-builder]
      summary: Generate or revise an app blueprint after the user chooses to build
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppBuilderInput"
      responses:
        "200":
          description: Generated app blueprint and conversational response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppBuilderResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: App generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /builder/projects/{projectId}/jobs:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/BuilderProjectId"
    post:
      operationId: createBuilderProjectJob
      tags: [generated-projects]
      summary: Generate or revise a React project and validate its build
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderProjectJobInput"
      responses:
        "201":
          description: Generation job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderProjectJob"
        "400":
          description: Invalid project request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Authentication service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Another project job is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The Router IA could not generate a project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /builder/projects/{projectId}/builds:
    parameters:
      - name: projectId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/BuilderProjectId"
    post:
      operationId: createBuilderProjectBuild
      tags: [generated-projects]
      summary: Rebuild a saved React project from its source files
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderProjectBuildInput"
      responses:
        "201":
          description: Build job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderProjectJob"
        "400":
          description: Invalid project files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Authentication service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Another project job is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /builder/project-jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getBuilderProjectJob
      tags: [generated-projects]
      summary: Read the stage and result of a generated-project job
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current job state, source files, diagnostics, and ready preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderProjectJob"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /builder/project-jobs/{jobId}/status:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getBuilderProjectJobStatus
      tags: [generated-projects]
      summary: Read lightweight progress for a generated-project job
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Job stage without source files or preview HTML
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderProjectJobStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Authentication service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /builder/project-jobs/{jobId}/runtime-check:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: reportBuilderProjectRuntimeCheck
      tags: [generated-projects]
      summary: Report a sandboxed browser smoke test for a project job
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuilderProjectRuntimeCheckInput"
      responses:
        "200":
          description: Current job state after the isolated runtime check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuilderProjectJob"
        "400":
          description: Invalid runtime check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: The preview is not awaiting a runtime check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Authentication service temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /builder/activate-module:
    post:
      operationId: activateBuilderModule
      tags: [app-builder]
      summary: Activate a user-approved, prebuilt app module
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppBuilderActivationInput"
      responses:
        "200":
          description: Validated module activation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppBuilderActivationResult"
        "400":
          description: Invalid or unapproved module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Module activation failed unexpectedly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /builder/reference-url:
    post:
      operationId: extractWebReference
      tags: [app-builder]
      summary: Extract visible text from a public webpage as an app reference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebReferenceInput"
      responses:
        "200":
          description: Page title and visible text suitable for use as a reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebReference"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: The public webpage could not be safely fetched or parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /lab/analyze:
    post:
      operationId: analyzeLabProject
      tags: [generated-projects]
      summary: Analyze imported software evidence and propose a safe adaptation strategy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabAnalysisInput"
      responses:
        "200":
          description: Static observations and Router IA adaptation analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabAnalysisResult"
        "400":
          description: Invalid analysis request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Router IA could not analyze the evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /router/status:
    get:
      operationId: getRouterStatus
      tags: [router]
      security: [{ bearerAuth: [] }]
      summary: Get Router IA configuration and connection status
      responses:
        "200":
          description: Router IA configuration state; secret values are never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterConnectionStatus"
  /router/providers:
    get:
      operationId: listRouterProviders
      tags: [router]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: User-owned providers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RouterProvider" }
    post:
      operationId: createRouterProvider
      tags: [router]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouterProviderInput" }
      responses:
        "201":
          description: Provider created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouterProvider" }
  /router/providers/{providerId}:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateRouterProvider
      tags: [router]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouterProviderUpdate" }
      responses:
        "200":
          description: Provider updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouterProvider" }
    delete:
      operationId: deleteRouterProvider
      tags: [router]
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: Provider deleted }
  /router/providers/{providerId}/test:
    parameters:
      - name: providerId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: testRouterProvider
      tags: [router]
      security: [{ bearerAuth: [] }]
      deprecated: true
      responses:
        "410":
          description: Direct provider inference is disabled in CoreX
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
  /router/test:
    post:
      operationId: testRouterConnection
      tags: [router]
      security: [{ bearerAuth: [] }]
      summary: Check Router IA health without invoking a model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouterConnectionTestInput"
      responses:
        "200":
          description: Router IA health status; no prompt or provider inference is sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouterConnectionStatus"
        "400":
          description: Invalid Router test request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /prisma/chat:
    post:
      operationId: sendPrismaChat
      tags: [prisma]
      security: [{ bearerAuth: [] }]
      summary: Send a conversational message through Router IA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrismaChatRequest"
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrismaChatResponse"
        "400":
          description: Invalid chat request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Prisma module is disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Per-user message limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Router IA request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AppBuilderTurn:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 1600
      required: [role, content]
    WebReferenceInput:
      type: object
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
      required: [url]
    WebReference:
      type: object
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        title:
          type: string
          maxLength: 160
        extractedText:
          type: string
          maxLength: 12000
      required: [url, title, extractedText]
    AppBuilderReference:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        kind:
          type: string
          enum: [image, document, code, archive, apk, binary]
        extractedText:
          type: string
          maxLength: 12000
        imageDataUrl:
          type: string
          maxLength: 1200000
          pattern: "^data:image/(jpeg|png|webp);base64,"
      required: [name, kind, extractedText]
    AppBuilderItem:
      type: object
      properties:
        id:
          type: string
          maxLength: 64
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 240
        value:
          type: string
          maxLength: 80
        checked:
          type: boolean
      required: [id, title, description, value, checked]
    AppBuilderSection:
      type: object
      properties:
        id:
          type: string
          maxLength: 64
        type:
          type: string
          enum: [stats, list, features, form, progress]
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 240
        actionLabel:
          type: string
          maxLength: 48
        items:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/AppBuilderItem"
      required: [id, type, title, description, actionLabel, items]
    AppBuilderKind:
      type: string
      enum: [tasks, habits, expenses, prototype]
    AppBuilderModuleId:
      type: string
      enum: [tasks-v1, habits-v1, expenses-v1]
    AppBuilderExpansionOption:
      type: object
      properties:
        moduleId:
          $ref: "#/components/schemas/AppBuilderModuleId"
        appKind:
          type: string
          enum: [tasks, habits, expenses]
        name:
          type: string
          maxLength: 80
        version:
          type: string
          maxLength: 24
        summary:
          type: string
          maxLength: 240
        capabilities:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 100
        limitations:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 140
        reason:
          type: string
          maxLength: 220
        recommended:
          type: boolean
        runtimeCost:
          type: integer
          enum: [0]
      required: [moduleId, appKind, name, version, summary, capabilities, limitations, reason, recommended, runtimeCost]
    AppBuilderExpansionProposal:
      type: object
      properties:
        status:
          type: string
          enum: [not-needed, approval-required, unavailable]
        message:
          type: string
          maxLength: 400
        options:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/AppBuilderExpansionOption"
      required: [status, message, options]
    AppBlueprint:
      type: object
      properties:
        title:
          type: string
          maxLength: 80
        subtitle:
          type: string
          maxLength: 140
        description:
          type: string
          maxLength: 240
        accentColor:
          type: string
          enum: [violet, ocean, mint, amber]
        appKind:
          $ref: "#/components/schemas/AppBuilderKind"
        sections:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/AppBuilderSection"
      required: [title, subtitle, description, accentColor, appKind, sections]
    BuilderConversationResult:
      type: object
      required: [assistantMessage, designBrief, readyToBuild]
      properties:
        assistantMessage:
          type: string
          minLength: 1
          maxLength: 1600
        designBrief:
          type: string
          maxLength: 6000
        readyToBuild:
          type: boolean
    BuilderConversationInput:
      type: object
      required: [prompt, previousBlueprint, history, referenceFiles]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 1600
        readyToBuild:
          type: boolean
          default: false
        designBrief:
          type: string
          maxLength: 6000
          default: ""
        previousBlueprint:
          anyOf:
            - $ref: "#/components/schemas/AppBlueprint"
            - type: "null"
        history:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/AppBuilderTurn"
        referenceFiles:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/AppBuilderReference"
    AppBuilderInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 3
          maxLength: 1600
        designBrief:
          type: string
          maxLength: 6000
          default: ""
        previousBlueprint:
          anyOf:
            - $ref: "#/components/schemas/AppBlueprint"
            - type: "null"
        history:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/AppBuilderTurn"
        referenceFiles:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/AppBuilderReference"
      required: [prompt, previousBlueprint, history, referenceFiles]
    AppBuilderTask:
      type: object
      properties:
        id:
          type: string
          maxLength: 80
        title:
          type: string
          maxLength: 140
        capability:
          type: string
          enum: [planning, structured-output]
        taskType:
          $ref: "#/components/schemas/RouterTaskType"
      required: [id, title, capability, taskType]
    AppBuilderResult:
      type: object
      properties:
        assistantMessage:
          type: string
          maxLength: 600
        blueprint:
          $ref: "#/components/schemas/AppBlueprint"
        expansionProposal:
          $ref: "#/components/schemas/AppBuilderExpansionProposal"
        tasks:
          type: array
          minItems: 1
          maxItems: 6
          items:
            $ref: "#/components/schemas/AppBuilderTask"
      required: [assistantMessage, blueprint, expansionProposal, tasks]
    BuilderProjectId:
      type: string
      minLength: 1
      maxLength: 80
      pattern: "^[A-Za-z0-9][A-Za-z0-9_-]*$"
    BuilderProjectJobId:
      type: string
      format: uuid
    GeneratedProjectFile:
      type: object
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 180
        content:
          type: string
          maxLength: 70000
      required: [path, content]
    BuilderProjectJobInput:
      type: object
      properties:
        mode:
          type: string
          enum: [builder, lab]
        prompt:
          type: string
          minLength: 3
          maxLength: 1600
        blueprint:
          $ref: "#/components/schemas/AppBlueprint"
        history:
          type: array
          maxItems: 12
          items:
            $ref: "#/components/schemas/AppBuilderTurn"
        referenceFiles:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/AppBuilderReference"
        files:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/GeneratedProjectFile"
      required: [prompt, blueprint, history, referenceFiles, files]
    LabStaticEvidence:
      type: object
      properties:
        filePaths:
          type: array
          maxItems: 80
          items: { type: string, maxLength: 180 }
        dependencies:
          type: array
          maxItems: 80
          items: { type: string, maxLength: 160 }
        entryPoints:
          type: array
          maxItems: 40
          items: { type: string, maxLength: 180 }
        components:
          type: array
          maxItems: 60
          items: { type: string, maxLength: 180 }
        assets:
          type: array
          maxItems: 80
          items: { type: string, maxLength: 180 }
        strings:
          type: array
          maxItems: 100
          items: { type: string, maxLength: 220 }
        permissions:
          type: array
          maxItems: 60
          items: { type: string, maxLength: 180 }
        networkCalls:
          type: array
          maxItems: 60
          items: { type: string, maxLength: 220 }
        storage:
          type: array
          maxItems: 40
          items: { type: string, maxLength: 180 }
      required: [filePaths, dependencies, entryPoints, components, assets, strings, permissions, networkCalls, storage]
    LabAnalysisInput:
      type: object
      properties:
        sourceName:
          type: string
          minLength: 1
          maxLength: 180
        sourceKind:
          type: string
          enum: [apk, archive, code, document, image, website, binary]
        goal:
          type: string
          maxLength: 1600
        evidenceText:
          type: string
          minLength: 1
          maxLength: 30000
        evidence:
          $ref: "#/components/schemas/LabStaticEvidence"
        visuals:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/LabVisualEvidence"
      required: [sourceName, sourceKind, goal, evidenceText, evidence]
    LabVisualEvidence:
      type: object
      properties:
        sourceName:
          type: string
          minLength: 1
          maxLength: 180
        imageDataUrl:
          type: string
          maxLength: 1200000
          pattern: "^data:image/(jpeg|png|webp);base64,"
      required: [sourceName, imageDataUrl]
    LabAnalysisResult:
      type: object
      properties:
        summary:
          type: string
          maxLength: 1600
        architecture:
          type: string
          maxLength: 1600
        capabilities:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 240 }
        observed:
          $ref: "#/components/schemas/LabStaticEvidence"
        inferred:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 240 }
        reusableModules:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 240 }
        adaptationPlan:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 300 }
        risks:
          type: array
          maxItems: 10
          items: { type: string, maxLength: 240 }

name: Deploy IAchat attachment fix
on:
  push:
    branches: [prisma/code-agent-json-diagnostics-20261014]
    paths: [.github/workflows/oracle-iachat-deploy.yml]
permissions:
  contents: read
concurrency:
  group: oracle-iachat-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - name: Deploy IAchat web UI with rollback
        shell: bash
        run: |
          set -euo pipefail
          cd /home/ubuntu/Proyecto/Aplicaciones/IAchat
          target=iachat/web.py
          backup=$(mktemp /tmp/iachat-web.XXXXXXXX.py)
          candidate=$(mktemp /tmp/iachat-new.XXXXXXXX.py)
          cp "$target" "$backup"
          changed=0
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ] && [ "$changed" -eq 1 ]; then
              cp "$backup" "$target"
              sudo -n systemctl restart iachat.service || true
              echo "IACHAT_ROLLED_BACK"
            fi
            rm -f "$backup" "$candidate"
          }
          trap cleanup EXIT
          GIT_SSH_COMMAND='ssh -i /home/ubuntu/.ssh/github_iachat -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes' git fetch --no-tags git@github.com:lgomezpallo/I.achat.Full.git main
          git show FETCH_HEAD:iachat/web.py > "$candidate"
          python3 - "$candidate" <<'PY'
          import sys
          from pathlib import Path
          s=Path(sys.argv[1]).read_text()
          assert 'var selectedFiles=[]' in s
          assert "remove.setAttribute('aria-label','Quitar '+f.name)" in s
          assert "selectedFiles=[];fileInput.value='';imageInput.value='';showSelectedAttachments()" in s
          compile(s, sys.argv[1], 'exec')
          print("IAchat source validated")
          PY
          cp "$candidate" "$target"
          changed=1
          sudo -n systemctl restart iachat.service
          sleep 3
          systemctl is-active --quiet iachat.service
          curl -fsS --max-time 10 http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl -fsS --max-time 10 http://127.0.0.1:8000/ | grep -q 'var selectedFiles=\[\]'
          echo "IACHAT_DEPLOY_VERIFIED"
